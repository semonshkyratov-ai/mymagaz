<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин Приложений</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 15px; margin: 0; }
        h1 { color: #58a6ff; font-size: 1.4rem; }
        .app-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; }
        .app-icon { width: 50px; height: 50px; background: #30363d; border-radius: 10px; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
        .app-info { flex: 1; min-width: 0; }
        .app-info h3 { margin: 0 0 5px 0; font-size: 1rem; word-break: break-word; }
        .app-info p { margin: 0; font-size: 0.8rem; color: #8b949e; word-break: break-word; }
        .download-btn { margin-left: 10px; background: #238636; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.8rem; white-space: nowrap; }
        .download-btn:hover { background: #2ea043; }
        #loading { text-align: center; color: #8b949e; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>📦 Магазин Приложений</h1>
    <div id="apps-container">
        <div id="loading">Загрузка каталога...</div>
    </div>
    <script>
        async function loadApps() {
            try {
                // Кэш-бастер: всегда свежий JSON
                const resp = await fetch('apps.json?t=' + Date.now());
                if (!resp.ok) throw new Error('Не удалось загрузить apps.json');
                const apps = await resp.json();
                renderApps(apps);
            } catch (e) {
                document.getElementById('loading').innerText = 'Ошибка загрузки каталога.';
                console.error(e);
            }
        }
        function renderApps(apps) {
            const container = document.getElementById('apps-container');
            if (!apps || apps.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#8b949e;margin-top:50px;">Пока нет приложений.</div>';
                return;
            }
            container.innerHTML = apps.map(app => `
                <div class="app-card">
                    <div class="app-icon">📱</div>
                    <div class="app-info">
                        <h3>${app.name}</h3>
                        <p>${app.description || 'Без описания'}</p>
                    </div>
                    <a class="download-btn" href="${app.url}" target="_blank">Скачать</a>
                </div>
            `).join('');
        }
        // Автообновление каждые 30 секунд (чтобы 2-й телефон видел новинки)
        loadApps();
        setInterval(loadApps, 30000);
    </script>
</body>
</html>
